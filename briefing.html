<script>
const GAS_SECRETARY = "https://script.google.com/macros/s/AKfycbzrbzTzcHus3miB8w_YkfXL4NshtfKssUYBqghG6F7FwI608aMr4OturJf1oUZ1Wcb7/exec";
const GAS_TASKS = "https://script.google.com/macros/s/AKfycbxeY0ollMVYWklFepuBRnbjdFc9gEu70WWnF_gdf_RRUfAcFTnL6PXdwAGMj0cXPBZueA/exec";
document.getElementById('targetDate').valueAsDate = new Date();
async function sendBriefing(){
  const type = document.getElementById('sendType').value;
  const date = document.getElementById('targetDate').value;
  const btn = document.getElementById('btnSend');
  const log = document.getElementById('statusLog');
  btn.disabled=true; btn.textContent='送信中...';
  log.textContent = `送信開始: type=${type} date=${date}\nGAS呼び出し中...`;
  const actions = { briefing: 'sendBoardStatus?slot=800', morning: 'sendBoardStatus?slot=700', evening: 'sendBoardStatus?slot=1800', all: 'sendBoardStatus?slot=all' };
  const actionParam = actions[type] || 'sendBoardStatus?slot=800';
  try{
    const url1 = `${GAS_SECRETARY}?action=${actionParam}&date=${date}`;
    log.textContent += `\n\n[1/2] Secretary GAS:\n${url1}`;
    const res1 = await fetch(url1);
    const text1 = await res1.text();
    log.textContent += `\n→ 応答: ${text1.substring(0,1500)}`;
    if(type==='briefing' || type==='all'){
      try{
        const url2 = `${GAS_TASKS}?action=sendAll&date=${date}`;
        log.textContent += `\n\n[2/2] LifeOS TASKS GAS:\n${url2}`;
        await fetch(url2, {mode:'no-cors'});
        log.textContent += `\n→ LifeOS送信済み`;
      }catch(e2){ log.textContent += `\n→ LifeOSエラー: ${e2.message}`; }
    }
    log.textContent += `\n\n✅ 完了！`;
    btn.textContent='✅ 送信完了！';
    setTimeout(()=>{ btn.disabled=false; btn.textContent='📧 今すぐ送信する'; }, 3000);
  }catch(e){
    log.textContent += `\n\n❌ エラー: ${e.message}`;
    btn.disabled=false; btn.textContent='📧 今すぐ送信する';
  }
}
</script>
