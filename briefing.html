<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信 - 秘書課 連絡ボード v2</title>
<style>
:root{--primary:#1a73e8;--border:#dadce0}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{background:#f4f6f9;color:#202124;padding:16px;max-width:860px;margin:0 auto}
header{text-align:center;margin:12px 0 16px}h1{font-size:20px;color:#1a73e8}
.card{background:#fff;border:1px solid var(--border);border-radius:14px;padding:18px;box-shadow:0 2px 6px rgba(0,0,0,0.04);margin-bottom:14px}
.btn-main{width:100%;height:56px;border:none;border-radius:999px;background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;box-shadow:0 8px 20px rgba(239,68,68,0.35)}
.btn-main:active{transform:scale(0.97)}
.btn-sub{width:100%;height:44px;border:1px solid var(--border);border-radius:999px;background:#fff;color:#5f6368;font-weight:700;margin-top:12px;display:flex;align-items:center;justify-content:center;text-decoration:none}
.log{background:#f8f9fa;border:1px dashed var(--border);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;min-height:60px;margin-top:14px}
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick a{flex:1;display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px;color:#1a73e8;text-decoration:none;font-weight:700;font-size:12px}
.select{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:10px;margin:8px 0 16px;background:#fff;font-size:14px}
label{font-size:12px;font-weight:700;color:#5f6368}
</style>
</head>
<body>
<header><h1>📧 送信 - 秘書課 連絡ボード v2</h1></header>
<div class="quick">
<a href="index.html">← 戻る</a>
<a href="https://docs.google.com/spreadsheets/d/15wyF-VILY9w3mbGzv-fy8mrOgBTnBiNrilhJ5U-eHy0/edit" target="_blank">📊 SS</a>
<a href="https://docs.google.com/document/d/1e2s7vzRQqSWUnoRP4f4gVl-MjwfkV2yGUFZfZlAw7RU/edit" target="_blank">📝 Doc</a>
</div>
<div class="card">
<label>送信タイプ</label>
<select id="sendType" class="select">
<option value="briefing" selected>08:00 1号 ⇔ 清水 ブリーフィング（メイン）</option>
<option value="morning">07:00 1号 ⇔ 2号 朝刊</option>
<option value="evening">18:00 1号 ⇔ 2号 夕刊</option>
<option value="all">全部（朝刊+ブリーフィング+夕刊）</option>
</select>
<label>対象日</label>
<input type="date" id="targetDate" class="select">
<button id="btnSend" class="btn-main" onclick="sendBriefing()">📧 今すぐ送信する</button>
<a href="index.html" class="btn-sub">← 連絡ボードに戻る</a>
<div id="statusLog" class="log">待機中...</div>
</div>
<script>
const GAS_SECRETARY = "https://script.google.com/macros/s/AKfycbzrbzTzcHus3miB8w_YkfXL4NshtfKssUYBqghG6F7FwI608aMr4OturJf1oUZ1Wcb7/exec";
const GAS_TASKS = "https://script.google.com/macros/s/AKfycbxeY0ollMVYWklFepuBRnbjdFc9gEu70WWnF_gdf_RRUfAcFTnL6PXdwAGMj0cXPBZueA/exec";
document.getElementById('targetDate').valueAsDate = new Date();
async function sendBriefing(){
  const type = document.getElementById('sendType').value;
  const date = document.getElementById('targetDate').value;
  const btn = document.getElementById('btnSend');
  const log = document.getElementById('statusLog');
  btn.disabled=true; btn.textContent='送信中...';
  log.textContent = `送信開始: type=${type} date=${date}\nGAS呼び出し中...`;
  const actions = { briefing: 'sendBoardStatus?slot=800', morning: 'sendBoardStatus?slot=700', evening: 'sendBoardStatus?slot=1800', all: 'sendBoardStatus?slot=all' };
  const actionParam = actions[type] || 'sendBoardStatus?slot=800';
  try{
    const url1 = `${GAS_SECRETARY}?action=${actionParam}&date=${date}`;
    log.textContent += `\n\n[1/2] Secretary GAS:\n${url1}`;
    const res1 = await fetch(url1);
    const text1 = await res1.text();
    log.textContent += `\n→ 応答: ${text1.substring(0,1500)}`;
    if(type==='briefing' || type==='all'){
      try{
        const url2 = `${GAS_TASKS}?action=sendAll&date=${date}`;
        log.textContent += `\n\n[2/2] LifeOS TASKS GAS:\n${url2}`;
        await fetch(url2, {mode:'no-cors'});
        log.textContent += `\n→ LifeOS送信済み`;
      }catch(e2){ log.textContent += `\n→ LifeOSエラー: ${e2.message}`; }
    }
    log.textContent += `\n\n✅ 完了！`;
    btn.textContent='✅ 送信完了！';
    setTimeout(()=>{ btn.disabled=false; btn.textContent='📧 今すぐ送信する'; }, 3000);
  }catch(e){
    log.textContent += `\n\n❌ エラー: ${e.message}`;
    btn.disabled=false; btn.textContent='📧 今すぐ送信する';
  }
}
</script>
</body>
</html>
