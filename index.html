<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>秘書課 連絡ボード v2</title>
<style>
:root{--bg:#f4f6f9;--card:#ffffff;--primary:#1a73e8;--border:#dadce0}
html,body{background:#f4f6f9 !important;color:#202124 !important}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
body{padding:16px;max-width:860px;margin:0 auto}
header{text-align:center;margin:12px 0 14px}h1{font-size:22px;color:#1a73e8}
.quick{display:flex;gap:8px;flex-wrap:nowrap;margin-bottom:14px;width:100%}
.btn{flex:1 1 33.33%;width:33.33%;min-width:0;max-width:33.33%;display:flex;align-items:center;justify-content:center;background:#ffffff !important;border:1px solid #dadce0;border-radius:10px;padding:12px 4px;color:#1a73e8 !important;text-decoration:none;font-weight:700;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.datebar{background:#fff;border:1px solid #dadce0;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.datebar input{padding:6px 10px;border-radius:6px;border:1px solid #dadce0;background:#fff;color:#202124}
.tl{display:flex;flex-direction:column;gap:14px}
.card{background:#fff !important;border:1px solid #dadce0;border-radius:12px;padding:18px;box-shadow:0 2px 4px rgba(0,0,0,.03)}
.card-h{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #f1f3f4;padding-bottom:10px;margin-bottom:10px}
.badge{padding:4px 10px;border-radius:16px;font-weight:800;font-size:12px;background:#e8eaed;color:#3c4043}
.status{padding:4px 12px;border-radius:12px;font-size:12px;font-weight:800}
.done{background:#e6f4ea;color:#137333} .pend{background:#fef7e0;color:#b06000}
.sum-label{font-size:11px;color:#5f6368;font-weight:700;margin-bottom:4px}
.sum-box{background:#f8f9fa !important;border-radius:8px;padding:12px;font-size:13px;line-height:1.6;color:#3c4043;min-height:44px;white-space:pre-wrap}
.log-box{margin-top:16px;background:#fff !important;border:1px dashed #dadce0;border-radius:10px;padding:12px;font-size:11px;color:#5f6368;max-height:300px;overflow:auto;white-space:pre-wrap}
footer{margin-top:28px;text-align:center;font-size:11px;color:#9aa0a6}
</style>
</head>
<body>
<header><h1>秘書課 連絡ボード v2</h1></header>
<div class="quick">
<a href="https://docs.google.com/spreadsheets/d/15wyF-VILY9w3mbGzv-fy8mrOgBTnBiNrilhJ5U-eHy0/edit" target="_blank" class="btn">📊 SS</a>
<a href="https://docs.google.com/document/d/1e2s7vzRQqSWUnoRP4f4gVl-MjwfkV2yGUFZfZlAw7RU/edit" target="_blank" class="btn">📝 Doc</a>
<a id="gasLink" href="#" target="_blank" class="btn">⚙️ GAS</a>
</div>
<div class="datebar"><label>表示対象日:</label><div style="display:flex;gap:8px"><input type="date" id="targetDate"><button onclick="loadData()" style="padding:6px 14px;border-radius:8px;border:1px solid #dadce0;background:#1a73e8;color:#fff;font-weight:700">更新</button></div></div>
<div class="tl">
<div class="card" id="card700"><div class="card-h"><div style="display:flex;gap:8px;align-items:center"><span class="badge">07:00</span><b>1号 ⇔ 2号 朝刊</b></div><span class="status done" id="status700">✓ 完了</span></div><div class="sum-label">概要</div><div class="sum-box" id="summary700">読み込み中...</div></div>
<div class="card" id="card800"><div class="card-h"><div style="display:flex;gap:8px;align-items:center"><span class="badge">08:00</span><b>1号 ⇔ 清水 ブリーフィング</b></div><span class="status done" id="status800">✓ 完了</span></div><div class="sum-label">概要</div><div class="sum-box" id="summary800">読み込み中...</div></div>
<div class="card" id="card1800"><div class="card-h"><div style="display:flex;gap:8px;align-items:center"><span class="badge">18:00</span><b>1号 ⇔ 2号 夕刊</b></div><span class="status pend" id="status1800">⏳ 待機</span></div><div class="sum-label">概要</div><div class="sum-box" id="summary1800">読み込み中...</div></div>
</div>
<div class="log-box" id="logBox">SS log 読み込み中...</div>
<footer>SS=バックグラウンド / フロント=新規作成 / GAS無料枠運用 | v2 light fixed</footer>
<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbzrbzTzcHus3miB8w_YkfXL4NshtfKssUYBqghG6F7FwI608aMr4OturJf1oUZ1Wcb7/exec";
document.getElementById('gasLink').href = GAS_URL;
async function loadData(){
  const date = document.getElementById('targetDate').value;
  const logBox = document.getElementById('logBox');
  logBox.textContent = 'GAS呼び出し: ' + GAS_URL + '?action=getBoardStatus&date=' + date;
  try{
    const res = await fetch(GAS_URL + '?action=getBoardStatus&date=' + date);
    const text = await res.text();
    try{
      const data = JSON.parse(text);
      if(data.session700){ document.getElementById('summary700').textContent = data.session700.summary; document.getElementById('status700').textContent = data.session700.isDone ? '✓ 完了' : '⏳ 待機'; }
      if(data.session800){ document.getElementById('summary800').textContent = data.session800.summary; }
      if(data.session1800){ document.getElementById('summary1800').textContent = data.session1800.summary; document.getElementById('status1800').textContent = data.session1800.isDone ? '✓ 完了' : '⏳ 待機'; document.getElementById('status1800').className = 'status ' + (data.session1800.isDone ? 'done' : 'pend'); }
      logBox.textContent = 'GAS応答OK v' + (data.version||'') + ' | log:' + (data.stats ? data.stats.totalLog : '?') + '件\n' + (data.raw ? data.raw.latest5 : '').substring(0,1000);
    }catch(e){
      logBox.textContent = 'GAS応答（JSON外）: ' + text.substring(0,2000);
    }
  }catch(e){ logBox.textContent = 'GAS取得失敗: ' + e.message; }
}
document.getElementById('targetDate').valueAsDate = new Date();
loadData();
</script>
</body>
</html>
